<!-- Modal: Table Selector Modal (Direct visits & Change table with live lock detection) -->
<div class="modal fade" id="tableModal" tabindex="-1" aria-labelledby="tableModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content card-surface border-0 shadow-lg">
            <form id="tableSelectForm" action="{% url 'menu:set_table' %}" method="POST">
                {% csrf_token %}
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title brand-font fw-bold" id="tableModalLabel">
                        <i class="bi bi-qr-code-scan text-danger me-2"></i> Choose Dining Table
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <!-- Dynamic Concurrency Alert Message -->
                    <div id="tableModalAlert" class="alert alert-danger py-2 px-3 small rounded-3 d-none mb-3 d-flex align-items-center gap-2" role="alert">
                        <i class="bi bi-shield-exclamation text-danger fs-6 flex-shrink-0"></i>
                        <span id="tableModalAlertText" class="flex-grow-1" style="font-size: 0.8rem; line-height: 1.35;"></span>
                    </div>

                    <!-- Takeaway Option Card -->
                    <div class="mb-3">
                        <button type="button" id="takeawaySelectBtn" class="btn btn-outline-surface w-100 py-2 px-3 d-flex align-items-center justify-content-between rounded-3 {% if not current_table_number %}border-warning bg-warning bg-opacity-10 text-dark fw-bold shadow-sm{% endif %}" onclick="selectTakeawayOption()">
                            <div class="d-flex align-items-center gap-2.5">
                                <div class="rounded-circle bg-warning bg-opacity-15 text-warning d-flex align-items-center justify-content-center flex-shrink-0" style="width: 34px; height: 34px;">
                                    <i class="bi bi-bag-check-fill fs-6"></i>
                                </div>
                                <div class="text-start">
                                    <span class="d-block fw-bold" style="font-size: 0.90rem; line-height: 1.2;">Takeaway / Self-Pickup</span>
                                    <span class="d-block small text-muted" style="font-size: 0.70rem;">Order without table assignment</span>
                                </div>
                            </div>
                            <span class="badge {% if not current_table_number %}bg-warning text-dark{% else %}bg-surface-raised border text-secondary{% endif %} rounded-pill px-2.5 py-1" style="font-size: 0.68rem;">
                                {% if not current_table_number %}<i class="bi bi-check2 me-0.5"></i> Selected{% else %}Select{% endif %}
                            </span>
                        </button>
                    </div>

                    <!-- Real-time Table Grid Header -->
                    <div class="d-flex align-items-center justify-content-between mb-2">
                        <label class="form-label fw-semibold small text-muted mb-0">
                            <i class="bi bi-shop text-primary me-1"></i>Dining Tables
                        </label>
                        <span id="tableStatusSpinner" class="spinner-border spinner-border-sm text-primary d-none" role="status" title="Syncing live occupancy..."></span>
                    </div>

                    <!-- Quick Table Tap Grid -->
                    <div class="row g-2 mb-2" id="modalTablesGrid">
                        {% for tbl in all_active_tables %}
                        <div class="col-4">
                            <button type="button" class="btn btn-outline-surface w-100 py-2 table-select-btn {% if current_table_number == tbl.table_number %}border-warning bg-warning bg-opacity-10 text-dark fw-bold shadow-sm{% endif %}" onclick="selectModalTable('{{ tbl.table_number }}', {{ tbl.is_locked|yesno:'true,false' }})" data-table="{{ tbl.table_number }}">
                                <span class="d-block fw-bold">{{ tbl.table_number }}</span>
                                <span class="d-block small text-muted" style="font-size: 0.7rem;">{{ tbl.capacity }} Seats</span>
                                {% if tbl.is_locked %}
                                    <span class="badge bg-danger rounded-pill" style="font-size: 0.6rem;"><i class="bi bi-lock-fill me-0.5"></i> Busy</span>
                                {% else %}
                                    <span class="badge bg-success rounded-pill" style="font-size: 0.6rem;">Free</span>
                                {% endif %}
                            </button>
                        </div>
                        {% endfor %}
                    </div>

                    <!-- Hidden Table Input Submitted With Form -->
                    <input type="hidden" id="modalTableInput" name="table_number" value="{{ current_table_number|default:'' }}">
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-outline-surface btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" id="modalSetTableBtn" class="btn btn-brand btn-sm px-4">Confirm Selection</button>
                </div>
            </form>
        </div>
    </div>
</div>
