<!-- Modal: Staff Password Change Modal (Self-Service Secure Change) -->
{% if staff_profile or user.is_superuser %}
<div class="modal fade" id="staffPasswordModal" tabindex="-1" aria-labelledby="staffPasswordModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content card-surface border-0 shadow-lg">
            <form id="staffPasswordForm" onsubmit="submitStaffChangePassword(event)">
                {% csrf_token %}
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title brand-font fw-bold" id="staffPasswordModalLabel">
                        <i class="bi bi-key-fill text-warning me-2"></i> Change Staff Password
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted small mb-3">
                        Logged in as <strong>{{ user.get_full_name|default:user.username }}</strong> ({{ staff_profile.get_role_display|default:"Administrator" }}).
                        Enter your current password to set a new password.
                    </p>

                    <div id="staffPasswordAlert" class="alert alert-danger py-2 px-3 small rounded-3 d-none mb-3" role="alert"></div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-muted">Current Password <span class="text-danger">*</span></label>
                        <input type="password" id="staffCurrentPassword" name="current_password" class="form-control" placeholder="Enter your existing password" required autocomplete="current-password">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-muted">New Password <span class="text-danger">*</span></label>
                        <input type="password" id="staffNewPassword" name="new_password" class="form-control" placeholder="At least 4 characters" minlength="4" required autocomplete="new-password">
                    </div>

                    <div class="mb-2">
                        <label class="form-label fw-semibold small text-muted">Confirm New Password <span class="text-danger">*</span></label>
                        <input type="password" id="staffConfirmPassword" name="confirm_password" class="form-control" placeholder="Repeat new password" minlength="4" required autocomplete="new-password">
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-outline-surface btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" id="staffPasswordSubmitBtn" class="btn btn-brand btn-sm px-4">Update Password</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endif %}
