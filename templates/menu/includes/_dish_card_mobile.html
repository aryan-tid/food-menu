<!-- Mobile Horizontal Food Card (< 768px) -->
<div class="dish-card-mobile">
    <!-- Left: Food details -->
    <div class="dish-mobile-info">
        <div class="d-flex align-items-center gap-1.5 mb-1">
            {% if item.is_veg %}
                <span class="tag-veg-pill"><i class="bi bi-record-circle-fill me-1"></i>VEG</span>
            {% else %}
                <span class="tag-nonveg-pill"><i class="bi bi-caret-up-square-fill me-1"></i>NON-VEG</span>
            {% endif %}

            {% if item.average_rating %}
                <span class="tag-rating-chip"><i class="bi bi-star-fill me-0.5"></i>{{ item.average_rating }}</span>
            {% endif %}
        </div>
        <h6 class="fw-bold mb-1 text-truncate" style="font-size: 0.95rem; color: var(--text-primary);">{{ item.name }}</h6>
        <p class="text-muted small mb-1" style="font-size: 0.76rem; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;">
            {{ item.description }}
        </p>
        <div class="d-flex align-items-center gap-2">
            <span class="fw-black brand-font fs-6" style="color: var(--color-primary);">₹{{ item.price }}</span>
            <span class="badge bg-surface-raised border text-secondary" style="font-size: 0.65rem;">{{ item.category.name }}</span>
        </div>
    </div>

    <!-- Right: Food image with overlapping action button -->
    <div class="dish-mobile-media">
        <img src="{{ item.get_image_url }}" alt="{{ item.name }}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300&fit=crop'">
        <div class="dish-mobile-action" id="home-stepper-m-{{ item.id }}">
            <button type="button" class="zomato-add-btn" onclick="handleHomeStepper({{ item.id }}, 'increase')">
                ADD <i class="bi bi-plus-lg"></i>
            </button>
        </div>
    </div>
</div>
