server {
    listen 80;
    server_name _; # Responds to any IP or domain on GCP

    client_max_body_size 20M;

    # Static files served directly by Nginx (or Whitenoise fallback)
    location /static/ {
        alias /var/www/food-menu/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Media files (uploaded food photos)
    location /media/ {
        alias /var/www/food-menu/media/;
        expires 30d;
        access_log off;
    }

    # Proxy all dynamic requests to Gunicorn backend
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
